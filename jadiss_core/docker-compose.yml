services:
  # FastAPI 애플리케이션
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jadiss-core-api
    ports:
      - "8090:8090"
    environment:
      - DATABASE_URL=postgresql://jadiss_core:jadiss_core##@jadiss-postgres:5432/core
    restart: always
    networks:
      - jadiss-project

networks:
  jadiss-project:
    external: true